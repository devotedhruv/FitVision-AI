name: fitvision_ai
description: "Android-first foundation for FitVision AI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.10.0
  exercise_engine:
    path: ../../packages/exercise_engine
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  permission_handler: ^12.0.1
  pose_landmarker:
    path: ../../packages/pose_landmarker
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.16.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
