name: fitvision_ai
description: "Android-first foundation for FitVision AI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.2.1
  connectivity_plus: ^7.0.0
  dio: ^5.10.0
  drift: ^2.30.1
  exercise_engine:
    path: ../../packages/exercise_engine
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  permission_handler: ^12.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pose_landmarker:
    path: ../../packages/pose_landmarker
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.16.0
  uuid: ^4.5.2
  google_maps_flutter: ^2.18.0
  clerk_auth: ^0.0.18-beta
  clerk_flutter: ^0.0.18-beta

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.30.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
